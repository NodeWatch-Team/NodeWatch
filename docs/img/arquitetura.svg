<svg viewBox="0 0 680 330" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs><marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5260"/></marker></defs>
  <rect x="2" y="2" width="676" height="54" rx="6" fill="#edf3fb" stroke="#2c5d9e"/>
  <text x="16" y="22" font-size="10.5" font-weight="600">Navegador · interface/painel.html (React 18, sem compilação)</text>
  <text x="16" y="42" font-size="9">Análise · Visão geral · Investigação (grafo SVG) · Transações · Detalhes · Operação · Assistente de dúvidas</text>
  <line x1="340" y1="56" x2="340" y2="80" stroke="#4a5260" stroke-width="1.3" marker-end="url(#seta)"/>
  <text x="348" y="72" font-size="9" fill="#4a5260">/api/painel · cabeçalho X-NodeWatch-Sessao</text>
  <rect x="2" y="82" width="676" height="152" rx="6" fill="#ffffff" stroke="#14213a" stroke-width="1.3"/>
  <text x="16" y="100" font-size="10.5" font-weight="600">Servidor local · Flask · src/servidor.py (127.0.0.1:5000) · só pedidos locais e da própria página</text>
  <rect x="16" y="110" width="318" height="112" rx="5" fill="#f6f7f9" stroke="#8a919c"/>
  <text x="26" y="127" font-size="10" font-weight="600">src/painel/</text>
  <text x="26" y="143" font-size="9">api.py: rotas · sessoes.py: autoriza o processamento</text>
  <text x="26" y="157" font-size="9">datasets.py: envio e validação em blocos</text>
  <text x="26" y="171" font-size="9">pipeline.py: 5 etapas medidas, cancelamento</text>
  <text x="26" y="185" font-size="9">score.py: 0–1000 · armazenamento.py: SQLite, grafo</text>
  <text x="26" y="199" font-size="9">sistema.py: CPU, RAM, latência, logs</text>
  <text x="26" y="213" font-size="9">assistente.py + contexto_sentinel.py: Assistente de dúvidas</text>
  <line x1="334" y1="166" x2="344" y2="166" stroke="#4a5260" stroke-width="1.3" marker-end="url(#seta)"/>
  <rect x="346" y="110" width="320" height="112" rx="5" fill="#eaf5ed" stroke="#2f7a45"/>
  <text x="356" y="127" font-size="10" font-weight="600">src/ml/ · núcleo de pontuação (nada é treinado aqui)</text>
  <text x="356" y="143" font-size="9">formatos.py: contratos de entrada</text>
  <text x="356" y="157" font-size="9">incremental.py: 49 atributos com estado por conta</text>
  <text x="356" y="171" font-size="9">previsao.py + modelos.py: score e motivos</text>
  <text x="356" y="185" font-size="9">provisionamento.py + modelo_ativo.py: instala e carrega</text>
  <text x="356" y="199" font-size="9">resultados_oficiais.py: métricas do teste oficial</text>
  <rect x="2" y="246" width="330" height="80" rx="6" fill="#fdf3e4" stroke="#a2650a"/>
  <text x="14" y="264" font-size="10" font-weight="600">Treino offline · python -m src.treino.cli</text>
  <text x="14" y="280" font-size="9">auditar · treinar · avaliar · prever · relatorio</text>
  <text x="14" y="294" font-size="9">precisa do IBM AML HI-Small (não vem no repositório)</text>
  <text x="14" y="308" font-size="9">nenhuma tela nem rota da API treina ou reajusta</text>
  <rect x="346" y="246" width="200" height="80" rx="6" fill="#f6f7f9" stroke="#8a919c"/>
  <text x="356" y="264" font-size="10" font-weight="600">Disco</text>
  <text x="356" y="280" font-size="9">modelos/: modelo distribuído (Git)</text>
  <text x="356" y="294" font-size="9">artefatos_ml/: modelo instalado,</text>
  <text x="356" y="308" font-size="9">datasets, análises (SQLite), logs</text>
  <line x1="446" y1="234" x2="446" y2="244" stroke="#4a5260" stroke-width="1.3" marker-end="url(#seta)"/>
  <rect x="558" y="246" width="120" height="80" rx="6" fill="#ffffff" stroke="#8a919c" stroke-dasharray="4 3"/>
  <text x="618" y="266" text-anchor="middle" font-size="10" font-weight="600">Sentinel AI</text>
  <text x="618" y="282" text-anchor="middle" font-size="9">Gemini ou Anthropic</text>
  <text x="618" y="296" text-anchor="middle" font-size="9">opcional, com chave</text>
  <text x="618" y="310" text-anchor="middle" font-size="9">e autorização na tela</text>
</svg>
