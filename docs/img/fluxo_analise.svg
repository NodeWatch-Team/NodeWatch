<svg viewBox="0 0 680 250" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs><marker id="s2" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#4a5260"/></marker></defs>
  <text x="4" y="18" font-size="9" font-weight="600" fill="#7a8290" letter-spacing="0.5">ANTES DO CLIQUE EM ANALISAR</text>
  <text x="236" y="18" font-size="9" font-weight="600" fill="#7a8290" letter-spacing="0.5">ANÁLISE (5 ETAPAS MEDIDAS NA TELA)</text>
  <g font-size="9.3">
    <rect x="4" y="30" width="100" height="84" rx="5" fill="#edf3fb" stroke="#2c5d9e"/><text x="54" y="50" text-anchor="middle" font-weight="600" font-size="10">Enviar</text><text x="54" y="68" text-anchor="middle">CSV ou ZIP, ou</text><text x="54" y="81" text-anchor="middle">dataset da lista</text><text x="54" y="100" text-anchor="middle" fill="#4a5260">sem limite de tamanho</text>
    <rect x="118" y="30" width="100" height="84" rx="5" fill="#edf3fb" stroke="#2c5d9e"/><text x="168" y="50" text-anchor="middle" font-weight="600" font-size="10">Validar</text><text x="168" y="68" text-anchor="middle">formato e linhas;</text><text x="168" y="81" text-anchor="middle">recusa com motivo</text><text x="168" y="100" text-anchor="middle" fill="#4a5260">nenhuma previsão</text>
    <rect x="236" y="30" width="80" height="84" rx="5" fill="#ebf6ee" stroke="#2f7a45"/><text x="276" y="50" text-anchor="middle" font-weight="600" font-size="10">1 Leitura</text><text x="276" y="68" text-anchor="middle">em blocos de</text><text x="276" y="81" text-anchor="middle">200 mil linhas</text>
    <rect x="324" y="30" width="80" height="84" rx="5" fill="#ebf6ee" stroke="#2f7a45"/><text x="364" y="50" text-anchor="middle" font-weight="600" font-size="10">2 Ordenação</text><text x="364" y="68" text-anchor="middle">data e hora;</text><text x="364" y="81" text-anchor="middle">IDs de exibição</text>
    <rect x="412" y="30" width="96" height="84" rx="5" fill="#ebf6ee" stroke="#2f7a45"/><text x="460" y="50" text-anchor="middle" font-weight="600" font-size="10">3 Pontuação</text><text x="460" y="68" text-anchor="middle">49 atributos +</text><text x="460" y="81" text-anchor="middle">modelo + SQLite,</text><text x="460" y="94" text-anchor="middle">em blocos</text>
    <rect x="516" y="30" width="76" height="84" rx="5" fill="#ebf6ee" stroke="#2f7a45"/><text x="554" y="50" text-anchor="middle" font-weight="600" font-size="10">4 Índices</text><text x="554" y="68" text-anchor="middle">e contagens</text><text x="554" y="81" text-anchor="middle">gerais</text>
    <rect x="600" y="30" width="76" height="84" rx="5" fill="#ebf6ee" stroke="#2f7a45"/><text x="638" y="50" text-anchor="middle" font-weight="600" font-size="10">5 Manifesto</text><text x="638" y="68" text-anchor="middle">status, tempos,</text><text x="638" y="81" text-anchor="middle">modelo, avisos</text>
  </g>
  <line x1="104" y1="72" x2="116" y2="72" stroke="#4a5260" marker-end="url(#s2)"/>
  <line x1="218" y1="72" x2="234" y2="72" stroke="#4a5260" marker-end="url(#s2)"/>
  <line x1="316" y1="72" x2="322" y2="72" stroke="#4a5260" marker-end="url(#s2)"/>
  <line x1="404" y1="72" x2="410" y2="72" stroke="#4a5260" marker-end="url(#s2)"/>
  <line x1="508" y1="72" x2="514" y2="72" stroke="#4a5260" marker-end="url(#s2)"/>
  <line x1="592" y1="72" x2="598" y2="72" stroke="#4a5260" marker-end="url(#s2)"/>
  <rect x="236" y="136" width="440" height="50" rx="5" fill="#f6f7f9" stroke="#8a919c"/>
  <text x="456" y="156" text-anchor="middle" font-size="10" font-weight="600">Investigação: consultas ao SQLite gravado, sem nova inferência</text>
  <text x="456" y="173" text-anchor="middle" font-size="9.3">visão geral · contas prioritárias · grafo da conta em foco · tabela com filtros · detalhes</text>
  <line x1="456" y1="114" x2="456" y2="134" stroke="#4a5260" marker-end="url(#s2)"/>
  <g font-size="9" fill="#4a5260">
    <text x="4" y="208">Exigem sessão ativa da aba: enviar, validar e analisar. Pedido de outra origem: HTTP 403.</text>
    <text x="4" y="223">Ponto seguro: entre blocos de leitura ou de pontuação. Cancelar ou perder a sessão para ali; o que já foi pontuado fica gravado (análise parcial).</text>
    <text x="4" y="238">Resultados em artefatos_ml/painel/analises/&lt;id&gt;/: manifesto.json e resultados.sqlite. Uma análise por vez.</text>
  </g>
</svg>
